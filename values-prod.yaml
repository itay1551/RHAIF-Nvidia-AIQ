# Single-cluster Validated Pattern (no ACM, no Vault, no ESO).
# Destination project is aiq-itay; create secret aiq-credentials there before sync.
clusterGroup:
  name: prod
  namespaces:
    aiq-itay:
      operatorGroup: false
  subscriptions: {}
  applications:
    aiq-maas-config:
      name: aiq-maas-config
      namespace: aiq-itay
      path: charts/aiq-maas-config
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
    aiq:
      name: aiq
      namespace: aiq-itay
      path: deploy/helm/deployment-k8s
      extraValueFiles:
        - /overrides/values-aiq-openshift.yaml
